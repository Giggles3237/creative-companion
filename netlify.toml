[build]
  command = "npm run build"
  publish = ".next"

[build.environment]
  NODE_VERSION = "22.13.0"

[functions]
  node_bundler = "esbuild"

[[headers]]
  for = "/*"
  [headers.values]
    Referrer-Policy = "strict-origin-when-cross-origin"
    X-Content-Type-Options = "nosniff"
    X-Frame-Options = "DENY"
